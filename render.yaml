services:
  - type: web
    name: learning-messenger
    runtime: python
    plan: free
    buildCommand: python -m py_compile "мессенджер.py" messenger_updates.py
    startCommand: python "мессенджер.py"
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: COOKIE_SECURE
        value: "true"
